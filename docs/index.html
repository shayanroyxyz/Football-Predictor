<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global Football Match Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 antialiased">

  <!-- Navigation / Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 px-4 py-4">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚽</span>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">Global Football Predictor</h1>
          <p class="text-xs text-slate-400">Live consensus market odds & mathematical forecasts</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="https://github.com/shayanroyxyz/Football-Predictor/actions/workflows/daily.yml" target="_blank" 
           class="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition-colors shadow">
          <span>⚡ Re-Run Actions</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6">
    
    <!-- Controls: Search & Tournament Filters -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
      <div class="relative w-full sm:w-80">
        <input type="text" id="searchInput" placeholder="Search team, league, or country..." 
               class="w-full bg-slate-950 border border-slate-700 text-xs rounded-lg px-3 py-2.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button id="filterAll" class="flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 text-white transition">All Matches</button>
        <button id="filterGlobal" class="flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Global / Cups</button>
        <button id="filterHigh" class="flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">🔥 Top Picks</button>
      </div>
    </div>

    <!-- Match Counter & Status -->
    <div class="flex items-center justify-between text-xs text-slate-400 mb-4 px-1">
      <span id="matchStats">Loading scheduled matches...</span>
      <span class="text-slate-500 text-[11px]">All times shown in UTC</span>
    </div>

    <!-- Grid Cards Container -->
    <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <!-- Empty State -->
    <div id="noResults" class="hidden text-center py-16">
      <p class="text-slate-400 text-sm">No matches found matching your selection.</p>
    </div>

  </main>

  <footer class="mt-12 text-center text-xs text-slate-600">
    <p>Automated with GitHub Actions • Data source: The-Odds-API Consensus</p>
  </footer>

  <script>
    let allMatches = [];

    // Helper: Determine if a match qualifies as a global/continental priority
    function isGlobalTournament(league) {
      const keywords = ["champions", "uefa", "europa", "libertadores", "nations", "world cup", "fifa", "copa sudamericana", "afcon", "asian cup"];
      return keywords.some(k => (league || "").toLowerCase().includes(k));
    }

    function renderCards(matches) {
      const container = document.getElementById("matchesContainer");
      const noResults = document.getElementById("noResults");
      const stats = document.getElementById("matchStats");

      container.innerHTML = "";
      stats.textContent = `Showing ${matches.length} scheduled fixtures`;

      if (matches.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      matches.forEach(m => {
        const p = m.probabilities || { home_win_pct: 33.3, draw_pct: 33.3, away_win_pct: 33.3 };
        const isGlobal = m.is_global || isGlobalTournament(m.league);
        const isHighConfidence = (p.home_win_pct >= 55 || p.away_win_pct >= 55);

        const borderStyle = isHighConfidence ? "border-amber-500/70" : "border-slate-800";
        const globalBadge = isGlobal ? `<span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[10px] px-2 py-0.5 rounded font-semibold uppercase tracking-wider">GLOBAL</span>` : "";
        const highBadge = isHighConfidence ? `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] px-2 py-0.5 rounded font-semibold uppercase tracking-wider">⭐ HIGH CONFIDENCE</span>` : "";

        const card = document.createElement("div");
        card.className = `bg-slate-900 border ${borderStyle} rounded-xl p-4 shadow-sm flex flex-col justify-between hover:border-slate-700 transition`;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-semibold text-slate-400 truncate uppercase tracking-wider">${m.league}</span>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                ${globalBadge}
                ${highBadge}
              </div>
            </div>

            <div class="flex items-center gap-2 mb-3 text-xs text-amber-400 font-medium">
              <span>🗓️ ${m.match_date || "Upcoming"}</span>
              <span class="text-slate-600">•</span>
              <span>⏰ ${m.match_time || "TBD"}</span>
            </div>

            <div class="text-base font-bold text-white mb-4 flex items-center justify-between gap-2">
              <span class="truncate w-5/12 text-left">${m.home}</span>
              <span class="text-xs text-slate-500 font-normal w-2/12 text-center">VS</span>
              <span class="truncate w-5/12 text-right">${m.away}</span>
            </div>

            <!-- Odds & Probability Bar -->
            <div class="grid grid-cols-3 gap-2 text-center text-xs font-medium mb-3">
              <div class="bg-slate-950 border border-slate-800/80 p-2.5 rounded-lg">
                <div class="text-slate-400 text-[10px] uppercase truncate mb-0.5">${m.home}</div>
                <div class="text-emerald-400 text-sm font-extrabold">${p.home_win_pct}%</div>
              </div>
              <div class="bg-slate-950 border border-slate-800/80 p-2.5 rounded-lg">
                <div class="text-slate-400 text-[10px] uppercase mb-0.5">Draw</div>
                <div class="text-amber-400 text-sm font-extrabold">${p.draw_pct}%</div>
              </div>
              <div class="bg-slate-950 border border-slate-800/80 p-2.5 rounded-lg">
                <div class="text-slate-400 text-[10px] uppercase truncate mb-0.5">${m.away}</div>
                <div class="text-sky-400 text-sm font-extrabold">${p.away_win_pct}%</div>
              </div>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-500">
            <span>Basis: ${m.bookmaker || "Market Consensus"}</span>
            <span class="text-indigo-400 font-medium">${isHighConfidence ? (p.home_win_pct >= 55 ? m.home + " to WIN" : m.away + " to WIN") : "Balanced Odds"}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Dynamic Filter handlers
    function setupFilters() {
      const search = document.getElementById("searchInput");
      const btnAll = document.getElementById("filterAll");
      const btnGlobal = document.getElementById("filterGlobal");
      const btnHigh = document.getElementById("filterHigh");

      let currentMode = "all";

      function apply() {
        const query = search.value.toLowerCase().trim();
        let filtered = allMatches.filter(m => {
          const matchText = `${m.home} ${m.away} ${m.league}`.toLowerCase();
          const matchesSearch = matchText.includes(query);
          
          if (!matchesSearch) return false;
          if (currentMode === "global") return m.is_global || isGlobalTournament(m.league);
          if (currentMode === "high") return (m.probabilities?.home_win_pct >= 55 || m.probabilities?.away_win_pct >= 55);
          return true;
        });
        renderCards(filtered);
      }

      function setButtonActive(activeBtn) {
        [btnAll, btnGlobal, btnHigh].forEach(b => {
          b.className = "flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
        });
        activeBtn.className = "flex-1 sm:flex-none px-3 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 text-white transition";
      }

      search.addEventListener("input", apply);

      btnAll.addEventListener("click", () => {
        currentMode = "all";
        setButtonActive(btnAll);
        apply();
      });

      btnGlobal.addEventListener("click", () => {
        currentMode = "global";
        setButtonActive(btnGlobal);
        apply();
      });

      btnHigh.addEventListener("click", () => {
        currentMode = "high";
        setButtonActive(btnHigh);
        apply();
      });
    }

    // Automatically load latest JSON generated by python workflow
    async function loadData() {
      const todayUTC = new Date().toISOString().split('T')[0];
      const paths = [
        `../predictions/${todayUTC}.json`,
        `predictions/${todayUTC}.json`
      ];

      for (let p of paths) {
        try {
          const res = await fetch(p);
          if (res.ok) {
            allMatches = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!allMatches || allMatches.length === 0) {
        // Fallback placeholder data if run has not finished yet
        allMatches = [
          {
            league: "UEFA Champions League",
            is_global: true,
            home: "Real Madrid",
            away: "Manchester City",
            match_date: todayUTC,
            match_time: "20:00 UTC",
            bookmaker: "Pinnacle Consensus",
            probabilities: { home_win_pct: 42.5, draw_pct: 26.5, away_win_pct: 31.0 }
          }
        ];
      }

      renderCards(allMatches);
      setupFilters();
    }

    loadData();
  </script>
</body>
</html>
